<main class="main" id="main">

      </div>
      <div class="topbar-actions">
        <div class="seg" data-seg="hook-filter" id="hook-filter">
          <button data-value="all" class="active">全部</button>
          <button data-value="major">仅主线</button>
          <button data-value="overdue">仅超期</button>
        </div>
      </div>
    </header>

    <div class="stack-24">

      <!-- 统计 -->
      <div class="grid-4" id="hook-stats" data-reveal></div>

      <!-- 状态泳道 -->
      <section class="card" data-reveal>
        <div class="card-head">
          <h2>状态泳道</h2>
          <span class="tag tag-quiet">8 条</span>
        </div>
        <div class="card-body">
          <div class="grid-3">
            <div class="lane">
              <div class="lane-head"><span>待回收</span><span class="mono" id="lane-count-planted">—</span></div>
              <div class="lane-body" id="lane-planted"></div>
            </div>
            <div class="lane">
              <div class="lane-head"><span>已回收</span><span class="mono" id="lane-count-resolved">—</span></div>
              <div class="lane-body" id="lane-resolved"></div>
            </div>
            <div class="lane">
              <div class="lane-head"><span>超期告警</span><span class="mono" id="lane-count-overdue">—</span></div>
              <div class="lane-body" id="lane-overdue"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 伏笔时间线 -->
      <section class="card" data-reveal>
        <div class="card-head">
          <h2>伏笔时间线</h2>
          <span class="tag tag-quiet">第 1 – 20 章</span>
        </div>
        <div class="card-body">
          <div class="timeline" id="hook-timeline"></div>
        </div>
      </section>

    </div>
  </div>

<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  'use strict';
  var $ = App.$, h = App.h;

  var hooks = [];
  var filter = 'all';

  var STATUS = {
    planted:  { tag: 'tag tag-seal',   label: '待回收', cls: '' },
    resolved: { tag: 'tag tag-ok',     label: '已回收', cls: 'is-resolved' },
    overdue:  { tag: 'tag tag-danger', label: '超期',   cls: 'is-overdue' }
  };

  var LANES = [
    { status: 'planted',  box: '#lane-planted',  count: '#lane-count-planted',  empty: '无待回收伏笔' },
    { status: 'resolved', box: '#lane-resolved', count: '#lane-count-resolved', empty: '无已回收伏笔' },
    { status: 'overdue',  box: '#lane-overdue',  count: '#lane-count-overdue',  empty: '无超期伏笔' }
  ];

  function emptyBox(text) {
    var el = h('div', { class: 'empty' });
    el.innerHTML =
      '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/><path d="m9.5 10.5 5 5"/><path d="m14.5 10.5-5 5"/></svg>' +
      '<span class="fs-12">' + text + '</span>';
    return el;
  }

  function hookCard(hk) {
    var s = STATUS[hk.status];
    var card = h('div', { class: 'hook-card' + (s.cls ? ' ' + s.cls : '') });
    card.innerHTML =
      (hk.importance === 'major' ? '<div style="margin-bottom:8px"><span class="chip">主线</span></div>' : '') +
      '<div class="hook-text">' + hk.content + '</div>' +
      '<div class="hook-meta">' +
        '<span class="mono">' + hk.id + ' · 埋于第 ' + hk.plantedChapter + ' 章</span>' +
        '<span class="' + s.tag + '">' + s.label + '</span>' +
      '</div>';
    return card;
  }

  /* ---------- 统计条 ---------- */
  function renderStats(s) {
    var majorOpen = hooks.filter(function (x) {
      return x.importance === 'major' && x.status !== 'resolved';
    }).length;
    var majorResolved = hooks.filter(function (x) {
      return x.importance === 'major' && x.status === 'resolved';
    }).length;

    var defs = [
      { label: '总伏笔', value: s.total,    hint: '全书追踪 · 回收率 ' + s.rate + '%', alert: false },
      { label: '已回收', value: s.resolved, hint: '主线 ' + majorResolved + ' 条 · 支线 ' + (s.resolved - majorResolved) + ' 条', alert: false },
      { label: '待回收', value: s.planted,  hint: '其中主线 ' + majorOpen + ' 条',      alert: false },
      { label: '超期告警', value: s.overdue, hint: '建议回收章已逾期',                  alert: true }
    ];

    var box = $('#hook-stats');
    box.innerHTML = '';
    defs.forEach(function (d) {
      var st = h('div', { class: 'stat' });
      st.innerHTML =
        '<div class="stat-label">' + d.label + '</div>' +
        '<div class="stat-value">' +
          (d.alert ? '<span class="dot" style="background:var(--crimson);vertical-align:middle;margin-right:6px"></span>' : '') +
          d.value +
        '</div>' +
        '<div class="fs-12 muted" style="margin-top:6px">' + d.hint + '</div>';
      box.appendChild(st);
    });
  }

  /* ---------- 状态泳道 ---------- */
  function renderLanes() {
    LANES.forEach(function (lane) {
      var list = hooks.filter(function (x) { return x.status === lane.status; });
      if (filter === 'major') list = list.filter(function (x) { return x.importance === 'major'; });
      if (filter === 'overdue' && lane.status !== 'overdue') list = [];

      $(lane.count).textContent = list.length;

      var box = $(lane.box);
      box.innerHTML = '';
      if (!list.length) {
        box.appendChild(emptyBox(lane.status !== 'overdue' && filter === 'overdue' ? '「仅超期」已隐藏本泳道' : lane.empty));
        return;
      }
      list.forEach(function (hk) { box.appendChild(hookCard(hk)); });
    });
  }

  /* ---------- 伏笔时间线 ---------- */
  function renderTimeline() {
    var byCh = {};
    hooks.forEach(function (hk) {
      /* 埋设章固定用 planted 语义色；仅 resolvedChapter 才用 resolved 语义色。
         同一章既是埋设又是回收时，两个色点叠加显示（下方 offsets 逻辑保证可辨）。 */
      (byCh[hk.plantedChapter] = byCh[hk.plantedChapter] || []).push('planted');
      if (hk.status === 'resolved' && hk.resolvedChapter) {
        (byCh[hk.resolvedChapter] = byCh[hk.resolvedChapter] || []).push('resolved');
      }
    });

    var tl = $('#hook-timeline');
    tl.innerHTML = '';
    for (var ch = 1; ch <= 20; ch++) {
      var row = h('div', { class: 'tl-row' });
      row.innerHTML = '<span class="tl-ch">第 ' + ch + ' 章</span>';

      var track = h('div', { class: 'tl-track' });
      var dots = byCh[ch] || [];
      dots.forEach(function (status, i) {
        var left = (ch - 1) / 19 * 100;
        if (dots.length > 1) left += (i - (dots.length - 1) / 2) * 4;
        left = Math.max(2, Math.min(98, left));

        var dot = h('span', {
          class: 'tl-dot' +
            (status === 'resolved' ? ' is-resolved' : (status === 'overdue' ? ' is-overdue' : ''))
        });
        dot.style.left = left.toFixed(1) + '%';
        dot.style.transform = 'translateX(-50%)';
        track.appendChild(dot);
      });

      row.appendChild(track);
      tl.appendChild(row);
    }
  }

  /* ---------- 筛选联动 ---------- */
  $('#hook-filter').addEventListener('seg:change', function (e) {
    filter = e.detail.value;
    renderLanes();
  });

  /* ---------- 载入 ---------- */
  var loadHooks = function () {
    Promise.all([api.hookStats(), api.listHooks()]).then(function (res) {
      hooks = res[1];
      renderStats(res[0]);
      renderLanes();
      renderTimeline();
    }).catch(function (e) {
      App.fail('#hook-stats', e, loadHooks);
    });
  };
  loadHooks();
})();
</script>
