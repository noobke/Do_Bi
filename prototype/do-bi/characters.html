<main class="main" id="main">

    <!-- topbar -->

    </header>

    <div style="display:grid;grid-template-columns:340px minmax(0,1fr);gap:var(--sp-24);align-items:start">

      <!-- ============ 左栏：角色列表 ============ -->

        <div class="card-head">
          <h2>角色</h2>
          <span class="tag tag-quiet" id="char-count">4</span>
        </div>
        <div class="list" id="char-list"></div>
      </section>

      <!-- ============ 右栏：角色详情 ============ -->

    </div>
  </div>

<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  'use strict';
  var $ = App.$, $$ = App.$$, h = App.h;
  var chars = [];
  var selectedId = 'char_001';

  function nameOf(id) {
    var hit = chars.filter(function (c) { return c.id === id; })[0];
    return hit ? hit.name : id;
  }

  /* ---------- 左栏列表 ---------- */
  function renderList() {
    var box = $('#char-list');
    box.innerHTML = '';
    chars.forEach(function (c) {
      var row = h('div', { class: 'list-row', 'data-id': c.id });
      var item = h('div', { class: 'char-item', style: 'flex:1;min-width:0' });
      item.innerHTML =
        '<div class="char-avatar' + (c.lead ? ' is-lead' : '') + '">' + c.name.charAt(0) + '</div>' +
        '<div class="row-main">' +
          '<div class="row-title">' + c.name + '</div>' +
          '<div class="row-sub">' + c.role + ' · ' + c.state.location + '</div>' +
        '</div>';
      row.appendChild(item);
      App.clickable(row, function () { select(c.id); });
      box.appendChild(row);
    });
    markActive();
  }

  function markActive() {
    $$('#char-list .list-row').forEach(function (r) {
      r.classList.toggle('is-active', r.dataset.id === selectedId);
    });
  }

  function select(id) {
    selectedId = id;
    markActive();
    renderDetail();
  }

  /* ---------- 右栏详情 ---------- */
  function renderDetail() {
    var c = chars.filter(function (x) { return x.id === selectedId; })[0];
    if (!c) return;

    var traits = c.immutableTraits.map(function (t) {
      return '<div class="trait"><i></i><span>' + t + '</span></div>';
    }).join('');

    var rels = c.relations.map(function (r) {
      return '<div class="list-row">' +
        '<div class="rel-row"><span class="rel-arrow">→</span><span class="chip">' + r.type + '</span></div>' +
        '<div class="row-main">' +
          '<div class="row-title">' + r.note + '</div>' +
          '<div class="row-sub fs-12 muted">' + nameOf(r.target) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    $('#char-detail').innerHTML =
      /* 1. 角色档案 */
      '<div class="card">' +
        '<div class="card-head">' +
          '<h2>角色档案</h2>' +
          '<span class="tag tag-quiet mono">' + c.id + '</span>' +
        '</div>' +
        '<div class="card-body stack">' +

          '<div>' +
            '<div class="grid-2">' +
              '<div class="stat"><div class="stat-label">身份</div><div class="stat-value">' + c.role + '</div></div>' +
              '<div class="stat"><div class="stat-label">首次登场</div><div class="stat-value">第 ' + c.firstAppearance + ' 章</div></div>' +
            '</div>' +
            '<div class="fs-13" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
              '<span class="chip">' + c.state.location + '</span>' +
              '<span class="chip">' + c.state.status + '</span>' +
            '</div>' +
          '</div>' +

          '<div>' +
            '<div class="fs-13" style="font-weight:500">不可变特征</div>' +
            '<div class="fs-13 muted">写入后不可被 AI 修改</div>' +
            '<div class="trait-list" style="margin-top:12px">' + traits + '</div>' +
          '</div>' +

          '<div class="grid-2">' +
            '<div class="card card-pad">' +
              '<div class="fs-12 muted">性格</div>' +
              '<div class="fs-14">' + c.personality + '</div>' +
            '</div>' +
            '<div class="card card-pad">' +
              '<div class="fs-12 muted">说话方式</div>' +
              '<div class="fs-14">' + c.speechStyle + '</div>' +
            '</div>' +
          '</div>' +

          '<div>' +
            '<div class="fs-13">当前状态：' + c.state.status + '</div>' +
            '<div class="fs-12 muted">更新于第 ' + c.updatedAtChapter + ' 章</div>' +
          '</div>' +

        '</div>' +
      '</div>' +

      /* 2. 关系 */
      '<div class="card">' +
        '<div class="card-head">' +
          '<h2>关系</h2>' +
          '<span class="tag tag-quiet">' + c.relations.length + ' 条</span>' +
        '</div>' +
        '<div class="card-body" style="padding:0">' +
          '<div class="list">' + rels + '</div>' +
        '</div>' +
      '</div>' +

      /* 3. 写作约束提示 */
      '<div class="card">' +
        '<div class="card-head"><h2>写作约束提示</h2></div>' +
        '<div class="card-body stack-8">' +
          '<p class="fs-13 muted">不可变特征会被审计规则 3（不可变特征被违背）逐章校验，一旦触发即阻塞定稿。</p>' +
          '<p class="fs-13 muted" title="Proposal → Validate → Commit 三步写入">改动角色状态会先给出提案，经你确认后才会写进设定；与已有设定冲突的部分会先标出来等你确认。</p>' +
          '<p class="fs-13 muted" title="OOC · 对应 L2 审计第 1 维，对照 personality 与 speechStyle">AI 会逐章检查角色是否符合既定性格与说话方式，偏离人设时会标出来。</p>' +
        '</div>' +
      '</div>';
  }

  /* ---------- 初始化 ---------- */
  var loadCharacters = function () {
    api.listCharacters().then(function (list) {
      chars = list;
      $('#char-count').textContent = list.length;
      renderList();
      renderDetail();
    }).catch(function (e) {
      App.fail('#char-list', e, loadCharacters);
    });
  };
  loadCharacters();

  $('#btn-new-char').addEventListener('click', function () {
    App.toast('新建角色（演示）');
  });
})();
</script>
